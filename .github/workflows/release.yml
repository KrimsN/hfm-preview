name: Release

# Публикация по тегу vX.Y.Z. Тег должен совпадать с version в package.json.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Версия тега совпадает с package.json
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "Тег $GITHUB_REF_NAME не совпадает с версией пакета ($expected)" >&2
            exit 1
          fi

      - run: npm run typecheck
      - run: npm test
      - run: npm run package

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash scripts/release-notes.sh "${GITHUB_REF_NAME#v}" > release-notes.md
          gh release create "$GITHUB_REF_NAME" *.vsix --title "$GITHUB_REF_NAME" --notes-file release-notes.md

      - name: VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then echo "VSCE_PAT не задан, пропускаю"; exit 0; fi
          npx vsce publish --no-dependencies --packagePath *.vsix

      - name: Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then echo "OVSX_PAT не задан, пропускаю"; exit 0; fi
          npx --yes ovsx publish *.vsix --pat "$OVSX_PAT"
